name: Rename to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv tu-barberia-cortes-de-cabello.html index.html
          git commit -m "Rename tu-barberia-cortes-de-cabello.html to index.html"
          git push
